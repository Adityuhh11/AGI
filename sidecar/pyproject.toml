[project]
name = "agi-sidecar"
version = "0.1.0"
description = "Local memory engine for AGI: indexing and search over localhost HTTP."
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "fastapi",
    "numpy",
    "pathspec",
    "pillow",
    "pypdfium2",
    "pyyaml",
    "threadpoolctl",
    "uvicorn",
]

[dependency-groups]
dev = ["httpx2", "pytest", "ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agi_memory"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not model and not perf'"
markers = [
    "model: needs the real llama-server and models (AGI_LLAMA_SERVER, AGI_MODEL_DIR); run with -m model",
    "perf: slow performance checks on 100k chunks; run with -m perf",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
